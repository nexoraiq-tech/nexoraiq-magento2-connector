<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Window Container -->
  <rect width="1000" height="680" rx="8" fill="#f8f9fa"/>
  <rect width="1000" height="680" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Admin Header Bar -->
  <rect width="1000" height="52" rx="8" fill="#303030"/>
  <rect y="44" width="1000" height="8" fill="#303030"/>
  <circle cx="24" cy="26" r="6" fill="#eb5252"/>
  <circle cx="44" cy="26" r="6" fill="#f5a623"/>
  <circle cx="64" cy="26" r="6" fill="#50e3c2"/>
  <text x="96" y="31" fill="#f3f4f6" font-size="13" font-weight="600" letter-spacing="0.5">MAGENTO ADMIN PANEL</text>
  <text x="320" y="31" fill="#9ca3af" font-size="12">Stores &gt; Configuration &gt; NexorAIQ &gt; Attributes &amp; Brands</text>
  <rect x="850" y="14" width="126" height="26" rx="4" fill="#6f4cf6"/>
  <text x="913" y="31" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Save Config</text>

  <!-- Left Admin Sidebar -->
  <rect x="0" y="52" width="70" height="628" fill="#1e1e1e"/>
  <g fill="#9ca3af" font-size="9" text-anchor="middle">
    <rect x="23" y="70" width="24" height="20" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="35" y="102">DASHBOARD</text>
    <path d="M23 125h24v16H23z" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="35" y="153">SALES</text>
    <path d="M23 175h24v16H23z" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="35" y="203">CATALOG</text>
    <rect x="0" y="220" width="70" height="56" fill="#2d2d2d"/>
    <rect x="0" y="220" width="4" height="56" fill="#eb5252"/>
    <circle cx="35" cy="240" r="9" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="35" y="263" fill="#ffffff" font-weight="bold">STORES</text>
    <circle cx="35" cy="298" r="8" fill="#6f4cf6"/>
    <text x="35" y="302" fill="#fff" font-size="10" font-weight="bold">AI</text>
    <text x="35" y="322" fill="#6f4cf6" font-weight="bold">NEXORAIQ</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(90, 72)">
    <!-- Section 1: Attributes Configuration -->
    <g transform="translate(0, 0)">
      <rect width="886" height="270" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
      <rect width="886" height="42" rx="8" fill="#fafafa"/>
      <rect y="36" width="886" height="6" fill="#fafafa"/>
      <line x1="0" y1="42" x2="886" y2="42" stroke="#e5e7eb" stroke-width="1"/>
      <text x="24" y="26" fill="#111827" font-size="14" font-weight="700">Attributes Configuration</text>

      <!-- Extra Attributes -->
      <g transform="translate(24, 60)">
        <text y="15" fill="#374151" font-size="13" font-weight="600">Extra Attributes to be Synced</text>
        <rect x="300" y="-3" width="380" height="96" rx="4" fill="#ffffff" stroke="#6f4cf6" stroke-width="1.5"/>
        <g transform="translate(305, 5)">
          <rect width="370" height="20" rx="3" fill="#ede9fe"/>
          <text x="10" y="14" fill="#6f4cf6" font-size="11" font-weight="600">✓ color (Color)</text>
          <rect y="22" width="370" height="20" rx="3" fill="#ede9fe"/>
          <text x="10" y="36" fill="#6f4cf6" font-size="11" font-weight="600">✓ size (Size)</text>
          <rect y="44" width="370" height="20" rx="3" fill="#ede9fe"/>
          <text x="10" y="58" fill="#6f4cf6" font-size="11" font-weight="600">✓ material (Material)</text>
          <text x="10" y="80" fill="#6b7280" font-size="11">   activity (Activity)</text>
        </g>
        <text x="300" y="112" fill="#6b7280" font-size="11">Filterable &amp; searchable attributes sync automatically. Select additional catalog attributes here.</text>
      </g>

      <!-- Ignore Description -->
      <g transform="translate(24, 200)">
        <text y="15" fill="#374151" font-size="13" font-weight="600">Ignore Description?</text>
        <rect x="300" y="-3" width="220" height="32" rx="4" fill="#ffffff" stroke="#d1d5db"/>
        <text x="315" y="18" fill="#111827" font-size="12">No</text>
        <path d="M495 14l5 5 5-5" stroke="#6b7280" stroke-width="1.5" fill="none"/>
        <text x="300" y="44" fill="#6b7280" font-size="11">Optionally strip HTML or filter stop words before catalog ingestion.</text>
      </g>
    </g>

    <!-- Section 2: Brands Configuration -->
    <g transform="translate(0, 290)">
      <rect width="886" height="295" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
      <rect width="886" height="42" rx="8" fill="#fafafa"/>
      <rect y="36" width="886" height="6" fill="#fafafa"/>
      <line x1="0" y1="42" x2="886" y2="42" stroke="#e5e7eb" stroke-width="1"/>
      <text x="24" y="26" fill="#111827" font-size="14" font-weight="700">Brands Configuration</text>

      <!-- Row 1: Multi brand store -->
      <g transform="translate(24, 60)">
        <text y="15" fill="#374151" font-size="13" font-weight="600">Is it multi brand store?</text>
        <rect x="300" y="-3" width="220" height="32" rx="4" fill="#ffffff" stroke="#d1d5db"/>
        <text x="315" y="18" fill="#111827" font-size="12">Yes</text>
        <path d="M495 14l5 5 5-5" stroke="#6b7280" stroke-width="1.5" fill="none"/>
        <text x="300" y="44" fill="#6b7280" font-size="11">Enables dedicated brand filtering facets and brand suggestion blocks.</text>
      </g>

      <!-- Row 2: Identified using -->
      <g transform="translate(24, 122)">
        <text y="15" fill="#374151" font-size="13" font-weight="600">Identified Using?</text>
        <rect x="300" y="-3" width="260" height="32" rx="4" fill="#ffffff" stroke="#d1d5db"/>
        <text x="315" y="18" fill="#111827" font-size="12">Product Attribute</text>
        <path d="M535 14l5 5 5-5" stroke="#6b7280" stroke-width="1.5" fill="none"/>
        <text x="300" y="44" fill="#6b7280" font-size="11">Identify brands from product attributes or custom catalog taxonomy.</text>
      </g>

      <!-- Row 3: Brand Attribute -->
      <g transform="translate(24, 184)">
        <text y="15" fill="#374151" font-size="13" font-weight="600">Brand Attribute</text>
        <rect x="300" y="-3" width="260" height="32" rx="4" fill="#ffffff" stroke="#d1d5db"/>
        <text x="315" y="18" fill="#111827" font-size="12">manufacturer (Brand / Manufacturer)</text>
        <path d="M535 14l5 5 5-5" stroke="#6b7280" stroke-width="1.5" fill="none"/>
        <text x="300" y="44" fill="#6b7280" font-size="11">Select the attribute NexorAIQ will map to the brand facet.</text>
      </g>
    </g>
  </g>
</svg>
